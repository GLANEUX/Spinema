# Stack complète : docker compose up -d --build
# En prod et en staging, le Nginx du serveur fait le HTTPS et renvoie vers les ports 127.0.0.1.
name: spinema

services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-spinema}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-spinema-api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spinema}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spinema}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PUBLISHED_PORT:-3000}:3000'

  web:
    image: nginx:1.30-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    restart: unless-stopped
    volumes:
      - ./apps/web/public:/usr/share/nginx/html:ro
      - ./infra/nginx/web.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      APK_URL: '${APK_URL:-https://github.com/GLANEUX/Spinema/releases/latest}'
    ports:
      - '127.0.0.1:${WEB_PUBLISHED_PORT:-8080}:80'

volumes:
  db-data:
