# Stack complète : docker compose up -d --build
# En prod et en staging, le Nginx du serveur fait le HTTPS et renvoie vers les ports 127.0.0.1.
name: spinema

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-spinema}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-spinema-api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spinema}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spinema}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - '127.0.0.1:${API_PUBLISHED_PORT:-3000}:3000'

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./apps/web/public:/usr/share/nginx/html:ro
      - ./infra/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${WEB_PUBLISHED_PORT:-8080}:80'

volumes:
  db-data:
