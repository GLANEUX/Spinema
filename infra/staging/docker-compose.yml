# Staging stack (branch preprod), installed in /opt/spinema-staging on the server.
# The CI copies this file there as docker-compose.yml, then runs deploy.sh.
# The server's Nginx does HTTPS and proxies to the 127.0.0.1 ports below.
# The server also hosts other production services: keep the memory limits.
name: spinema-staging

services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-spinema}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/glaneux/spinema-api:${API_TAG:-preprod}
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spinema}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spinema}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:?définir CORS_ORIGINS dans .env}
    ports:
      - '127.0.0.1:3100:3000'

  # Access code in front of the staging pages (code and secret in .env, see scripts/set-staging-code.sh).
  gate:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    restart: unless-stopped
    mem_limit: 48m
    user: node
    read_only: true
    command: ['node', '/gate/server.mjs']
    volumes:
      - ./infra/staging/gate:/gate:ro
    environment:
      ACCESS_CODE: ${STAGING_ACCESS_CODE:?définir le code avec scripts/set-staging-code.sh}
      GATE_SECRET: ${GATE_SECRET:?définir le code avec scripts/set-staging-code.sh}

  web:
    image: nginx:1.30-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    restart: unless-stopped
    mem_limit: 32m
    depends_on:
      - gate
    volumes:
      - ./apps/web/public:/usr/share/nginx/html:ro
      - ./infra/staging/web.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      APK_URL: 'https://github.com/GLANEUX/Spinema/releases/download/preprod-latest/spinema-preprod.apk'
    ports:
      - '127.0.0.1:8180:80'

volumes:
  db-data:
