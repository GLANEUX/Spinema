# Example for the Nginx already running on the server (PLAN.md §4).
# Copy to /etc/nginx/sites-available/, adapt the domain, then: certbot --nginx -d <domaine> -d api.<domaine>

server {
  server_name <domaine>;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  server_name api.<domaine>;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    # WebSocket (Socket.IO) for live draws
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }
}
