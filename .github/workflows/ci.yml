name: CI

# Quick checks on every pull request and on the three long-lived branches:
# dev (daily work), preprod (test builds), main (production).
on:
  pull_request:
  push:
    branches: [dev, preprod, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Expo doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor

  api-image:
    name: API Docker image
    # Only for the servers: preprod -> staging, main -> production.
    if: github.event_name == 'push' && (github.ref_name == 'preprod' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/glaneux/spinema-api:${{ github.sha }}
            ghcr.io/glaneux/spinema-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    # preprod -> staging server. Setup: ./scripts/setup-staging-server.sh (infra/staging/README.md).
    if: github.event_name == 'push' && github.ref_name == 'preprod'
    runs-on: ubuntu-latest
    needs: api-image
    concurrency: deploy-staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::No STAGING_SSH_KEY secret: staging not deployed (run ./scripts/setup-staging-server.sh)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # deploy.sh reads the registry token, then the stack files.
          {
            echo "$GH_TOKEN"
            tar -cz --transform 's|^infra/staging/docker-compose.yml$|docker-compose.yml|' \
              infra/staging/docker-compose.yml apps/web/public infra/nginx/web.conf infra/backup
          } | ssh -i ~/.ssh/deploy "spinema@$SSH_HOST" deploy
