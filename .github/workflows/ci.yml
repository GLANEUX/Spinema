name: CI

# Quick checks on every pull request and on the three long-lived branches:
# dev (daily work), preprod (test builds), main (production).
on:
  pull_request:
  push:
    branches: [dev, preprod, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Expo doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor

  api-image:
    name: API Docker image
    # Only for the servers: preprod -> staging, main -> production.
    if: github.event_name == 'push' && (github.ref_name == 'preprod' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/glaneux/spinema-api:${{ github.sha }}
            ghcr.io/glaneux/spinema-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
