name: CI

# Quick checks on every pull request and on the three long-lived branches:
# dev (daily work), preprod (test builds), main (production).
on:
  pull_request:
  push:
    branches: [dev, preprod, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Staging access code tests
        run: node --test infra/staging/gate/gate.test.mjs
      - run: pnpm build
      - name: Expo doctor
        # Blocking for every check except the exact SDK patch versions: Expo publishes patches
        # almost every week, and that alone must not turn the CI red (see the next step).
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: pnpm dlx expo-doctor@1.21.5
      - name: Expo patch versions
        # Warning only. To update: cd apps/mobile && pnpm exec expo install --fix
        working-directory: apps/mobile
        run: |
          if ! pnpm exec expo install --check; then
            echo "::warning title=Correctifs Expo disponibles::Mettre à jour avec : cd apps/mobile && pnpm exec expo install --fix"
          fi

  api-image:
    name: API Docker image
    # Only for the servers: preprod -> staging, main -> production.
    if: github.event_name == 'push' && (github.ref_name == 'preprod' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/glaneux/spinema-api:${{ github.sha }}
            ghcr.io/glaneux/spinema-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    # preprod -> staging server. Setup: ./scripts/setup-staging-server.sh (infra/staging/README.md).
    if: github.event_name == 'push' && github.ref_name == 'preprod'
    runs-on: ubuntu-latest
    needs: api-image
    environment: staging
    concurrency: deploy-staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::No STAGING_SSH_KEY secret: staging not deployed (run ./scripts/setup-staging-server.sh)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # deploy.sh reads the registry token, then the stack files.
          {
            echo "$GH_TOKEN"
            tar -cz --transform 's|^infra/staging/docker-compose.yml$|docker-compose.yml|' \
              infra/staging/docker-compose.yml infra/staging/web.conf.template infra/staging/gate \
              apps/web/public infra/backup
          } | ssh -i ~/.ssh/deploy "spinema@$SSH_HOST" deploy
