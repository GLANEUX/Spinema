name: Android

# Builds the Android app with Gradle (no Expo account needed). Android builds are slow
# (~25 min), so they only run on the release branches:
# - push on preprod: "Spinema préprod" APK, published on the "preprod-latest" GitHub pre-release
# - push on main: production APK + AAB (Play Store), published on the release v<version>
# - manual run (Actions > Android > Run workflow): on preprod, same as a push (rebuild after a
#   variable change); on another branch, préprod APK as an artifact only
on:
  push:
    branches: [preprod, main]
    paths:
      ['apps/mobile/**', 'packages/shared/**', 'pnpm-lock.yaml', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APP_VARIANT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      BUILD_NUMBER: ${{ github.run_number }}
      # API addresses are repository variables (Settings > Secrets and variables > Actions > Variables).
      EXPO_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/main' && vars.API_URL_PRODUCTION || vars.API_URL_PREVIEW }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: App version
        id: version
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(pnpm exec expo config --type public --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$APP_VARIANT" = production ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::La version $VERSION est déjà publiée. Augmente 'version' dans apps/mobile/app.config.ts avant de fusionner dans main."
            exit 1
          fi

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key (fine for testing, not for the Play Store)."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "args=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: apps/mobile/android
        run: |
          TASKS="assembleRelease"
          if [ "$APP_VARIANT" = production ]; then TASKS="assembleRelease bundleRelease"; fi
          ./gradlew $TASKS --no-daemon ${{ steps.signing.outputs.args }}

      - name: Collect files
        id: files
        run: |
          mkdir -p out
          NAME="spinema-${APP_VARIANT}-v${{ steps.version.outputs.version }}-${BUILD_NUMBER}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/$NAME.apk"
          if [ -f apps/mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "out/$NAME.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: spinema-${{ env.APP_VARIANT }}-${{ github.run_number }}
          path: out/*
          retention-days: 14

      - name: Publish préprod
        if: github.ref == 'refs/heads/preprod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not named "preprod": a tag with the branch name makes `git push origin preprod` ambiguous.
          TAG=preprod-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Spinema préprod" \
            --notes "Dernière version de test, reconstruite à chaque mise à jour de la branche preprod. Installe le fichier .apk sur ton téléphone."
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do gh release delete-asset "$TAG" "$asset" -y; done
          # Same file under a fixed name: staging.spinema.fr/spinema.apk links to it.
          cp out/*.apk out/spinema-preprod.apk
          gh release upload "$TAG" out/*.apk
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes "Version de test nº ${BUILD_NUMBER} (commit ${GITHUB_SHA::7}). Installe le fichier .apk sur ton téléphone."

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "Spinema v$VERSION" --generate-notes
