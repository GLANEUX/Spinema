# Développement : seulement Postgres, l'API et l'app tournent en local (pnpm dev).
# docker compose -f docker-compose.dev.yml up -d
name: spinema-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-moi}
      POSTGRES_DB: ${POSTGRES_DB:-spinema}
    volumes:
      - db-dev-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'

volumes:
  db-dev-data:
