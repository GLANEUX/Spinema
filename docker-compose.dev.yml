# Développement : seulement Postgres, l'API et l'app tournent en local (pnpm dev).
# docker compose -f docker-compose.dev.yml up -d
name: spinema-dev

services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-moi}
      POSTGRES_DB: ${POSTGRES_DB:-spinema}
    volumes:
      - db-dev-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'

  # Catches every email the API sends (SMTP_HOST=localhost, SMTP_PORT=1025): http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  db-dev-data:
