packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Prebuilt binaries are used; their install scripts are not needed.
  '@parcel/watcher': false
  unrs-resolver: false
  # Optional native helpers of testcontainers (SSH, CPU detection); not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false
# Security fixes for indirect dependencies (pnpm audit), until the packages that pull them in update.
overrides:
  # Used by the Expo CLI (dev tooling only): several advisories fixed in 1.4.3.
  node-forge: '>=1.4.3'
