packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Prebuilt binaries are used; their install scripts are not needed.
  '@parcel/watcher': false
  unrs-resolver: false
  # Optional native helpers of testcontainers (SSH, CPU detection); not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false
# Security fixes for indirect dependencies (pnpm audit), until the packages that pull them in update.
overrides:
  # Used by the Expo CLI (dev tooling only): several advisories fixed in 1.4.3.
  node-forge: '>=1.4.3'
  # Old esbuild used by drizzle-kit's TS loader (@esbuild-kit): dev-server advisory fixed in 0.25.
  '@esbuild-kit/core-utils>esbuild': '^0.25.12'
  # glob and minimatch pulled in by Expo, Jest and ESLint: advisories fixed in glob 14 / minimatch 11
  # (same API for these major lines).
  'glob@>=10 <14.0.2': '^14.0.2'
  'minimatch@>=9 <11.0.1': '^11.0.1'
